<!-- @dsCard group="Components" viewport="700x420" name="Symbols & arrows" subtitle="DifficultySymbol, DirectionArrow, DestinationIcon" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;font-family:var(--font-body);background:#fff;color:var(--text-body)}.lbl{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = window.HawkPrideSignageDesignSystem_931354;
const { DifficultySymbol, DirectionArrow, DestinationIcon, ARROW_PRESETS } = NS;
const lv=['easy','moderate','difficult','extreme'];
const dirs=['straight','bear-right','right','back-right','back','back-left','left','bear-left'];
const dest=['campground','check-in','parking','fuel','food','first-aid','viewpoint','trailhead','store','water','exit','caution'];
function App(){return <div style={{display:'flex',flexDirection:'column',gap:20}}>
<div style={{display:'flex',gap:28,alignItems:'center'}}>{lv.map(l=><DifficultySymbol key={l} level={l} size={56}/>)}<DifficultySymbol level="access" size={40}/>
<div style={{display:'flex',gap:10,alignItems:'center',background:'var(--difficulty-moderate)',padding:10,borderRadius:4}}>{lv.map(l=><DifficultySymbol key={l} level={l} tone="white" size={26}/>)}</div></div>
<div style={{display:'flex',gap:14,alignItems:'center'}}>{dirs.map((d,i)=><DirectionArrow key={d} direction={d} level={['easy','moderate','difficult','extreme','destination','easy','moderate','difficult'][i]} size={44}/>)}</div>
<div style={{display:'flex',gap:14,alignItems:'center',flexWrap:'wrap'}}>{(ARROW_PRESETS||[]).map((d,i)=><DirectionArrow key={d} direction={d} level={['easy','moderate','difficult','extreme','destination'][i%5]} size={44}/>)}</div>
<div style={{display:'flex',gap:16,alignItems:'center'}}>{dest.map(d=><DestinationIcon key={d} destination={d} size={34}/>)}</div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
