<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-body);color:var(--text-body);background:#fff}.l{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}.m{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:72px;border-radius:4px}</style></head><body><div style="display:grid;grid-template-columns:1fr 40px 1fr;gap:8px 12px;align-items:center;font-size:13px"><div class="m" style="font-size:13px">1 — Paved or Dirt Road</div><div>→</div><div style="display:flex;gap:10px;align-items:center;font-weight:700"><div style="width:28px;height:6px;border-radius:3px;background:var(--access-road-line)"></div>Access Road</div><div class="m" style="font-size:13px">2 — Easy</div><div>→</div><div style="display:flex;gap:10px;align-items:center;font-weight:700"><svg width="18" height="18" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="var(--difficulty-easy)"/></svg>Easy</div><div class="m" style="font-size:13px">3 — Moderate</div><div>→</div><div style="display:flex;gap:10px;align-items:center;font-weight:700"><svg width="18" height="18" viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" fill="var(--difficulty-moderate)"/></svg>Moderate</div><div class="m" style="font-size:13px">4 — Moderate Hard</div><div>→</div><div style="display:flex;gap:10px;align-items:center;font-weight:700"><svg width="18" height="18" viewBox="0 0 100 100"><path d="M50 2 L98 50 L50 98 L2 50Z" fill="var(--difficulty-difficult)"/></svg>Difficult</div><div class="m" style="font-size:13px">5 — Hard</div><div>→</div><div style="display:flex;gap:10px;align-items:center;font-weight:700"><svg width="18" height="18" viewBox="0 0 100 100"><path d="M50 2 L98 50 L50 98 L2 50Z" fill="var(--difficulty-difficult)"/></svg>Difficult</div><div class="m" style="font-size:13px">6 — Extreme</div><div>→</div><div style="display:flex;gap:10px;align-items:center;font-weight:700"><svg width="32.4" height="18" viewBox="0 0 180 100"><path d="M45 2 L88 50 L45 98 L2 50Z M135 2 L178 50 L135 98 L92 50Z" fill="var(--difficulty-extreme)"/></svg>Extreme</div></div></body></html>
