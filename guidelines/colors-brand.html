<!-- @dsCard group="Colors" viewport="700x190" name="Brand colors" subtitle="Black + white carry the signs; yellow is a document accent" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-body);color:var(--text-body);background:#fff}.l{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}.m{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:72px;border-radius:4px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--hp-yellow)"></div><div style="font-weight:700;font-size:13px">Hawk Yellow</div><div class="m">--hp-yellow<br>#FFC900<br>documents only</div></div><div class="sw"><div class="chip" style="background:var(--hp-black)"></div><div style="font-weight:700;font-size:13px">Hawk Black</div><div class="m">--hp-black<br>#0E0E0E<br>ink, board border + header</div></div><div class="sw"><div class="chip" style="background:var(--hp-white);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div style="font-weight:700;font-size:13px">White</div><div class="m">--hp-white<br>#FFFFFF<br>sign faces, decals</div></div></div></body></html>
