<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-body);color:var(--text-body);background:#fff}.l{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}.m{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:72px;border-radius:4px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--difficulty-easy)"></div><div style="font-weight:700;font-size:13px">Easy · Green</div><div class="m">--difficulty-easy<br>#24883F<br>circle</div></div><div class="sw"><div class="chip" style="background:var(--difficulty-moderate)"></div><div style="font-weight:700;font-size:13px">Moderate · Blue</div><div class="m">--difficulty-moderate<br>#1F6FC5<br>square</div></div><div class="sw"><div class="chip" style="background:var(--difficulty-difficult)"></div><div style="font-weight:700;font-size:13px">Difficult · Red</div><div class="m">--difficulty-difficult<br>#C92A38<br>diamond</div></div><div class="sw"><div class="chip" style="background:var(--difficulty-extreme)"></div><div style="font-weight:700;font-size:13px">Extreme · Purple</div><div class="m">--difficulty-extreme<br>#7A3AAD<br>double diamond</div></div></div></body></html>
