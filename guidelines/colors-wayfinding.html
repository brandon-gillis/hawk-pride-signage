<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-body);color:var(--text-body);background:#fff}.l{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}.m{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:72px;border-radius:4px}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--wayfinding-destination)"></div><div style="font-weight:700;font-size:13px">Destination</div><div class="m">--wayfinding-destination<br>#0E0E0E<br>board arrow + icon</div></div><div class="sw"><div class="chip" style="background:var(--access-road-sign)"></div><div style="font-weight:700;font-size:13px">Access road sign</div><div class="m">--access-road-sign<br>#6B4426<br>street blade</div></div><div class="sw"><div class="chip" style="background:var(--access-road-line)"></div><div style="font-weight:700;font-size:13px">Access road line</div><div class="m">--access-road-line<br>#6E6E6E<br>map line</div></div><div class="sw"><div class="chip" style="background:var(--route-green-line)"></div><div style="font-weight:700;font-size:13px">Green Line route</div><div class="m">--route-green-line<br>#0B5D33<br>route badge</div></div></div></body></html>
